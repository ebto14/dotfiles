########################################################################################
# HYPRLAND 0.55+ - OPTIMIZADO PARA NVIDIA RTX 5070 + i7-13700KF (ARCH LINUX)
# CONFIGURACIÓN OPTIMIZADA PARA EVITAR PARPADEO (FLICKER) EN MONITORES GRANDES
########################################################################################

################
### MONITORS ###
################
monitor = DP-3, 5120x1440@120, 0x0, 1

###################
### MY PROGRAMS ###
###################
$terminal = kitty
$fileManager = thunar
$menu = wofi --show drun
$browser = zen-browser
$screenshot = grim -g "$(slurp)"
$fullscreenshot = grim
$lock = hyprlock
$picker = hyprpicker -a

#################
### AUTOSTART ###
#################
# 1. System & Core
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = /usr/lib/xdg-desktop-portal-kde
exec-once = kwalletd6
#exec-once = xhost +SI:localuser:root
exec-once = udiskie

# 2. Daemons & Background Apps
#exec-once = nm-applet &
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = awww-daemon

# 3. UI Components
exec-once = swaync
exec-once = pkill waybar; waybar
exec-once = sleep 2 && awww img $(find ~/Imágenes -type f | shuf -n 1)

#############################
### ENVIRONMENT VARIABLES ###
#############################
# --- NVIDIA & Hardware ---
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = GBM_BACKEND,nvidia-drm

# [RECOMENDACIÓN] Se comenta NVD_BACKEND,direct temporalmente.
# En drivers Nvidia recientes con Wayland, el backend directo a veces causa parpadeos masivos de pantalla completa.
env = NVD_BACKEND,direct

# --- VRR / GSYNC ---
env = __GL_GSYNC_ALLOWED,1
env = __GL_VRR_ALLOWED,1

# --- Wayland & Qt/GTK ---
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_QPA_PLATFORMTHEME,qt6ct
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# --- XDG Specifications ---
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_MENU_PREFIX,plasma-
env = KDE_FULL_SESSION,true
env = KDE_SESSION_VERSION,6

# --- Cursors ---
env = XCURSOR_SIZE,15
env = HYPRCURSOR_SIZE,15

#####################
### LOOK AND FEEL ###
#####################
general {
    gaps_in = 8
    gaps_out = 15
    border_size = 2

    col.active_border = rgba(5e81acee) rgba(88c0d0ee) 45deg
    col.inactive_border = rgba(595959aa)

    resize_on_border = true
    allow_tearing = true # Habilitado globalmente, controlado por Window Rules abajo

    layout = dwindle
}

decoration {
    rounding = 10

    active_opacity = 1.0
    inactive_opacity = 0.92

    shadow {
        enabled = true
        range = 10
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 10
        passes = 4
        vibrancy = 0.1696
    }
}

animations {
    enabled = yes

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = quick,0.15,0,0.1,1

    animation = global,1,10,default
    animation = windows,1,6,easeOutQuint
    animation = layers,1,5,easeOutQuint
    animation = workspaces,1,6,easeOutQuint,slide
}

######################
### DWINDLE LAYOUT ###
######################
dwindle {
    force_split = 2
    preserve_split = false
    smart_split = true # Muy recomendable en monitores ultrawide
    smart_resizing = true
    permanent_direction_override = false
    special_scale_factor = 1
    split_width_multiplier = 1.0
    use_active_for_splits = true
    default_split_ratio = 1.0
    split_bias = 0
    precise_mouse_move = true # Mejor precisión al mover ventanas
}

#######################
### RENDER & SYSTEM ###
#######################
render {
    # [RECOMENDACIÓN] Se cambia direct_scanout a false de manera preventiva.
    # Evita que Nvidia intente bypassear el compositor en apps a pantalla completa,
    # lo cual reduce drásticamente las caídas de sincronización y parpadeos.
    direct_scanout = false
}

cursor {
    no_hardware_cursors = false
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true

    # [RECOMENDACIÓN] Cambiado de 1 a 0.
    # VRR (G-Sync) provoca parpadeo de brillo intenso en paneles grandes VA/IPS cuando los FPS
    # varían o cuando la pantalla está mayormente estática en el escritorio de Wayland.
    vrr = 0
}

debug {
    overlay = false
    damage_blink = false
}

#############
### INPUT ###
#############
input {
    kb_layout = us,ara
    kb_options = grp:alt_shift_toggle

    follow_mouse = 1

    # FORZAR Aceleración plana (Raw Input)
    accel_profile = flat
    sensitivity = 0

    touchpad {
        natural_scroll = true
        drag_lock = true
    }
}

device {
    name = razer-razer-atheris-mobile-gaming-mouse
    accel_profile = flat
}

###################
### KEYBINDINGS ###
###################
$mainMod = SUPER

# Apps & System Actions
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, Q, killactive
bind = $mainMod SHIFT, Q, exit
bind = $mainMod SHIFT, U, exec, $fileManager
bind = $mainMod SHIFT, B, exec, brave
bind = $mainMod SHIFT, F, exec, firefox
bind = $mainMod SHIFT, O, exec, $browser
bind = $mainMod SHIFT, G, exec, google-chrome-stable
bind = $mainMod SHIFT, Y, exec, dolphin
bind = $mainMod SHIFT, K, exec, steam
bind = $mainMod, D, exec, sh ~/.config/rofi/launchers/type-2/launcher.sh
bind = $mainMod SHIFT, P, exec, sh -c 'awww img "$(find ~/Imágenes -type f | shuf -n 1)"'
bind = $mainMod, L, exec, $lock
bind = $mainMod, W, exec, wlogout

# Lanzar la PWA de WhatsApp Web (Brave)
bind = $mainMod SHIFT, I, exec, /opt/brave-bin/brave --profile-directory=Default --app-id=hnpfjngllnobngcgfapefoaidbinmjnm

# Winbox
bind = $mainMod SHIFT, W, exec, wine ~/Mikrotik/winbox64.exe

# Clipboard Manager
bind = $mainMod, V, exec, cliphist list | wofi -dmenu | cliphist decode | wl-copy

# Screenshots
bind = ,Print, exec, $fullscreenshot && notify-send "Full Screenshot Taken" -t 2000
bind = $mainMod, Print, exec, $screenshot && notify-send "Screenshot Taken" -t 2000

# Fullscreen
bind = $mainMod, Tab, fullscreen

#########################
### WINDOW NAVIGATION ###
#########################
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

##################
### WORKSPACES ###
##################
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bindel = $mainMod CTRL, left, workspace, -1
bindel = $mainMod CTRL, right, workspace, +1

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

##################
### MULTIMEDIA ###
##################
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

###################
### SCRATCHPADS ###
###################
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

#############
### MOUSE ###
#############
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

####################
### WINDOW RULES ###
####################

# --- Reglas Base ---
hl.window_rule({ name = "prevent-maximize", match = { class = ".*" }, maximize = false })

# --- Winbox (Wine) ---
hl.window_rule({ name = "winbox-floating", match = { class = "wine.*", title = "Winbox.*" }, float = true })

# --- Gaming & Tearing (RTX 5070 Optimization) ---
hl.window_rule({ name = "steam-tearing", match = { class = "steam_app_.*" }, immediate = true })
hl.window_rule({ name = "gamescope-tearing", match = { class = "gamescope" }, immediate = true })

# --- Interfaces ---
hl.window_rule({ name = "pavucontrol-float", match = { class = "pavucontrol" }, float = true })
hl.window_rule({ name = "nm-editor-float", match = { class = "nm-connection-editor" }, float = true })
